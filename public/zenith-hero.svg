<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" role="img" aria-labelledby="title desc">
  <title id="title">Zenith multi-cloud resource illustration</title>
  <desc id="desc">Cloud providers connect through Zenith to compute, training, and storage resources.</desc>
  <defs>
    <linearGradient id="panel" x1="90" y1="70" x2="430" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#ecfeff"/>
    </linearGradient>
    <linearGradient id="brand" x1="205" y1="160" x2="315" y2="270" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4f46e5"/>
      <stop offset="0.55" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#312e81" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect x="52" y="42" width="416" height="336" rx="52" fill="url(#panel)" opacity="0.82"/>
  <g fill="none" stroke="#818cf8" stroke-width="3" stroke-linecap="round" opacity="0.48">
    <path d="M155 118l74 73"/>
    <path d="M365 118l-74 73"/>
    <path d="M139 291l90-54"/>
    <path d="M381 291l-90-54"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="202" y="156" width="116" height="116" rx="34" fill="url(#brand)"/>
    <path d="M231 185h60v15l-38 28h38v16h-64v-15l39-28h-35z" fill="white"/>
  </g>
  <g fill="white" stroke="#c7d2fe" stroke-width="2">
    <rect x="92" y="82" width="126" height="72" rx="22"/>
    <rect x="302" y="82" width="126" height="72" rx="22"/>
    <rect x="76" y="264" width="142" height="72" rx="22"/>
    <rect x="302" y="264" width="142" height="72" rx="22"/>
  </g>
  <g fill="#312e81" font-family="OPPO Sans 4.0, OPPO Sans, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" text-anchor="middle">
    <text x="155" y="125">多云资源</text>
    <text x="365" y="125">统一视图</text>
    <text x="147" y="307">计算与训练</text>
    <text x="373" y="307">数据与模型</text>
  </g>
  <g fill="#6366f1">
    <circle cx="155" cy="104" r="5"/>
    <circle cx="365" cy="104" r="5"/>
    <circle cx="147" cy="286" r="5"/>
    <circle cx="373" cy="286" r="5"/>
  </g>
</svg>
